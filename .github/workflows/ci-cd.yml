
name: End-to-End DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: Run application tests
  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  # Job 2: Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-dashboard:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save devops-dashboard:${{ github.sha }} -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # Job 3: Scan Docker image for vulnerabilities
  security-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-dashboard:${{ github.sha }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # Job 4: Publish image to Docker Hub
  publish:
    name: Publish Image to Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/devops-dashboard:${{ github.sha }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/devops-dashboard:latest" .

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/devops-dashboard:${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/devops-dashboard:latest"
